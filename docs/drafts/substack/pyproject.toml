[project]
name = "polaris-substack"
version = "0.1.0"
description = "Local authoring and publishing tools for The Polaris Flow Dispatch"
requires-python = ">=3.11"
dependencies = [
    "great-tables>=1.0.0",
    "latex2mathml>=3.81.1",
    "nokap>=0.1.0",
    "pandas>=3.0.6",
    "python-substack==0.10.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
dispatch = "substack_cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["substack_cli", "table_renderer"]
